function aiReply(q){
  const l=currentLead();
  const low=q.toLowerCase();
  if(low.includes('resum')&&l){
    return 'Ficha de '+l.nombre+' ('+l.sector+', '+l.ciudad+'):\n· '+l.rating+'★ con '+l.resenas+' reseñas.\n· Web: '+(l.web_tipo?('solo '+l.web_tipo):'sin web propia')+'.\n· Lead score '+l.score+'/100.\n· Estado: '+ESTADOS[l.estado].label+'.\n· Punto fuerte: reputación sólida. Oportunidad: '+(l.web_tipo?'centralizar su presencia':'crear su web y ganar captación online')+'.';
  }
  if((low.includes('gancho')||low.includes('descrip')||low.includes('redact'))&&l){
    return 'Gancho propuesto para '+l.nombre+':\n«'+(l.web_tipo?('Tienes '+l.rating+'★ en Google pero solo una página de '+l.web_tipo+'.'):(l.rating+'★ y '+l.resenas+' reseñas, pero ningún sitio web propio.'))+' Tus clientes buscan en Google y no te encuentran: una web propia convertiría esas visitas en reservas.»';
  }
  if((low.includes('próxima')||low.includes('proxima')||low.includes('siguiente'))&&l){
    return 'Próxima acción sugerida:\n'+
      (l.estado==='nuevo'?'Llamada de primer contacto hoy: el negocio es reciente en el embudo.':'')+
      (l.estado==='callback'?'Llamada en la fecha agendada · '+fmtDateTime(l.proxima_accion||todayShift(0,17))+'.':'')+
      (l.estado==='presentado'?('Seguimiento post-demo: la demo acumula '+((l.demos[0]||{}).visitas||0)+' visitas, buen momento para cerrar.'):'')+
      (l.estado==='potencial'?'Enviar propuesta con plan y precio; hay interés declarado.':'')+
      (l.estado==='no_interes'?'Marcar para recontacto a 6 meses; motivo actual: '+(l.motivo_descarte||'—')+'.':'');
  }
  if(low.includes('prioriz')||low.includes('hoy')||low.includes('tareas')){
    const ls=visibleLeads().filter(x=>x.estado==='nuevo'||x.estado==='callback').sort((a,b)=>b.score-a.score).slice(0,3);
    return 'Prioridad de hoy por lead score:\n'+ls.map((x,i)=>(i+1)+'. '+x.nombre+' ('+x.score+') · '+ESTADOS[x.estado].label).join('\n');
  }
  if(low.includes('web')&&low.includes('sin')){
    const n=visibleLeads().filter(x=>!x.web_tipo).length;
    return 'Tienes '+n+' leads sin web propia en tu ámbito. El motor de búsqueda deduplica por place_id y teléfono; los marcados con «solo Facebook/Instagram» también cuentan como sin web propia.';
  }
  return 'Puedo ayudarte con el flujo de captación: resumir una ficha, redactar el gancho comercial, sugerir la próxima acción o priorizar tus tareas. Abre la ficha de un lead para darme más contexto y lo haré sobre ese negocio.';
}

/* =========================================================================
   SERVIDOR COMO FUENTE DE VERDAD (v1.3.0)
   Todo lo que se hace en el navegador se sube al servidor y lo que hacen los
   demás se baja cada 30 s. localStorage queda como caché sin conexión.
   ========================================================================= */
const SYNC_FIELDS=['estado','motivo_descarte','asignado_a','proxima_accion','proxima_tipo','intentos','no_contactar','descripcion_ia','score','email','telefono','search_id'];
const PENDING_RAW={};
const SYNC={running:false,again:false,timer:null,debounce:null,state:null,status:'idle',error:'',lastOk:null,count:0,inSync:false,lastRaw:null,needRender:false,refetch:{}};
function sidOf(l){return l&&l.server_id?l.server_id:null;}
function syncKey(){const s=settings();return apiBase()+'|'+((s.apiUser&&s.apiUser.id)||'');}
function syncState(){
  if(SYNC.state&&SYNC.state.key===syncKey())return SYNC.state;
  let o=null;try{o=JSON.parse(localStorage.getItem('od.sync')||'null');}catch(e){}
  if(!o||typeof o!=='object'||o.key!==syncKey())o={key:syncKey(),shadow:{},lastPull:null};
  if(!o.shadow||typeof o.shadow!=='object')o.shadow={};
  SYNC.state=o;return o;
}
function saveSyncState(){try{localStorage.setItem('od.sync',JSON.stringify(SYNC.state||{}));}catch(e){}}
function localFields(l){
  const o={};
  SYNC_FIELDS.forEach(function(k){
    let v=l[k];if(v===undefined||v==='')v=null;
    if(k==='intentos')v=parseInt(v,10)||0;
    else if(k==='no_contactar')v=!!v;
    else if(k==='score')v=(v===null||isNaN(Number(v)))?null:Math.max(0,Math.min(100,Math.round(Number(v))));
    else if(k==='proxima_accion'&&v){const d=new Date(v);v=isNaN(d.getTime())?null:d.toISOString();}
    else if(k==='estado'&&ESTADOS_LEAD.indexOf(v)<0)v='nuevo';
    else if(v!==null&&typeof v!=='boolean')v=String(v);
    o[k]=v;
  });
  return o;
}
function fieldsHash(o){return JSON.stringify(SYNC_FIELDS.map(function(k){return o[k]===undefined?null:o[k];}));}
function isPending(l){const st=syncState();const sid=sidOf(l);if(!sid)return true;const sh=st.shadow[sid];return sh!==undefined&&fieldsHash(localFields(l))!==sh;}
function apiJSON(method,path,body,ms){
  const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=setTimeout(function(){if(ctrl)ctrl.abort();},ms||60000);
  const opt={method:method,headers:apiHeaders(body!==undefined)};
  if(body!==undefined)opt.body=JSON.stringify(body);
  if(ctrl)opt.signal=ctrl.signal;
  return fetch(apiBase()+path,opt).then(function(res){
    return res.json().catch(function(){return {};}).then(function(j){
      if(!res.ok){apiAuthFailed(res);const e=new Error((j&&j.error)||('HTTP '+res.status));e.status=res.status;throw e;}
      return j;
    });
  }).finally(function(){clearTimeout(t);});
}
function leadPayload(l){
  return {id:l.id,place_id:l.place_id||null,nombre:l.nombre,sector:l.sector,direccion:l.direccion,ciudad:l.ciudad,lat:l.lat,lng:l.lng,
    telefono:l.telefono,email:l.email,web_tipo:l.web_tipo,redes:l.redes,rating:l.rating,resenas:l.resenas,horario:l.horario,maps:l.maps,
    descripcion_ia:l.descripcion_ia,score:l.score,fuente:l.fuente,image_url:l.image_url||null,estado:l.estado,motivo_descarte:l.motivo_descarte,
    asignado_a:l.asignado_a,search_id:l.search_id,proxima_accion:localFields(l).proxima_accion,proxima_tipo:l.proxima_tipo,intentos:l.intentos,
    no_contactar:!!l.no_contactar,created_at:leadAlta(l),raw:PENDING_RAW[l.id]||undefined};
}
function fromServerLead(r){
  return {id:r.id,server_id:r.id,place_id:r.place_id,nombre:r.nombre,sector:r.sector||'Negocio',direccion:r.direccion||'',ciudad:r.ciudad||'',
    lat:r.lat,lng:r.lng,telefono:r.telefono||'',email:r.email||'',web_detectada:!!r.web_detectada,web_tipo:r.web_tipo||null,
    redes:Array.isArray(r.redes)?r.redes:[],rating:Number(r.rating)||0,resenas:r.resenas||0,horario:r.horario||'',maps:r.maps||'',
    descripcion_ia:r.descripcion_ia||'',score:r.score==null?0:r.score,estado:r.estado||'nuevo',motivo_descarte:r.motivo_descarte||null,
    asignado_a:r.asignado_a||null,search_id:r.search_id||null,proxima_accion:r.proxima_accion||null,proxima_tipo:r.proxima_tipo||null,
    intentos:r.intentos||0,no_contactar:!!r.no_contactar,fuente:r.fuente||'Servidor',fotos:[],image_url:r.image_url||null,
    created_at:r.created_at||new Date().toISOString(),interactions:[],demos:[],calls:[]};
}
function applyServerLead(l,r,overwriteCrm){
  ['nombre','sector','direccion','ciudad','lat','lng','web_tipo','horario','maps','image_url','place_id'].forEach(function(k){if(r[k]!==null&&r[k]!==undefined&&r[k]!=='')l[k]=r[k];});
  if(r.rating!==null&&r.rating!==undefined)l.rating=Number(r.rating)||0;
  if(r.resenas!==null&&r.resenas!==undefined)l.resenas=r.resenas;
  if(Array.isArray(r.redes)&&r.redes.length)l.redes=r.redes;
  if(overwriteCrm){
    SYNC_FIELDS.forEach(function(k){l[k]=(r[k]===undefined?null:r[k]);});
    l.score=r.score==null?(l.score||0):r.score;l.descripcion_ia=r.descripcion_ia||l.descripcion_ia||'';
    l.telefono=r.telefono||'';l.email=r.email||'';
  }
}
function mergeServerInteractions(l,its){
  if(!Array.isArray(its)||!its.length)return false;
  let added=false;
  its.forEach(function(it){
    if(it.client_ref&&l.interactions.some(function(i){return i.id===it.client_ref;}))return;
    if(l.interactions.some(function(i){return i.srv===it.id;}))return;
    l.interactions.push({id:'srv-'+it.id,srv:it.id,s:1,user_id:it.user_id||'system',tipo:it.tipo,resultado:it.resultado||null,nota:it.nota||'',fecha:it.fecha});
    added=true;
  });
  if(added)l.interactions.sort(function(a,b){return new Date(a.fecha)-new Date(b.fecha);});
  return added;
}
function removeLocalLead(l){const i=DB.leads.indexOf(l);if(i>=0)DB.leads.splice(i,1);}

async function pushNew(){
  const st=syncState();
  const pend=DB.leads.filter(function(l){return !l.server_id&&!l.sync_skip;});
  if(!pend.length)return 0;
  let excluded=0,adopted=0;
  for(let i=0;i<pend.length;i+=100){
    const chunk=pend.slice(i,i+100);
    const byRef={};chunk.forEach(function(l){byRef[l.id]=l;});
    const j=await apiJSON('POST','/api/leads',{leads:chunk.map(leadPayload)},120000);
    const bySid={};DB.leads.forEach(function(l){if(l.server_id)bySid[l.server_id]=l;});
    (j.leads||[]).forEach(function(r){
      const l=byRef[r.client_ref];if(!l)return;
      delete PENDING_RAW[l.id];
      const twin=bySid[r.id];
      if(twin&&twin!==l){
        /* Dos fichas locales del mismo negocio: se fusionan en una. */
        l.interactions.forEach(function(it){if(!twin.interactions.some(function(x){return x.id===it.id;}))twin.interactions.push(it);});
        DB.searches.forEach(function(s){if(Array.isArray(s.leadIds))s.leadIds=s.leadIds.map(function(x){return x===l.id?twin.id:x;});});
        removeLocalLead(l);return;
      }
      l.server_id=r.id;bySid[r.id]=l;
      if(r.image_url&&!l.image_url)l.image_url=r.image_url;
      if(r.duplicate){
        if(r.no_contactar&&!l.no_contactar){l.no_contactar=true;adopted++;}
        if(r.estado&&r.estado!=='nuevo'&&l.estado==='nuevo'){l.estado=r.estado;adopted++;}
        if(r.asignado_a&&!l.asignado_a)l.asignado_a=r.asignado_a;
        l.intentos=Math.max(l.intentos||0,r.intentos||0);
      }
      const srv=localFields(Object.assign({},l,{estado:r.estado,motivo_descarte:r.motivo_descarte,asignado_a:r.asignado_a,proxima_accion:r.proxima_accion,proxima_tipo:r.proxima_tipo,intentos:r.intentos,no_contactar:r.no_contactar,descripcion_ia:r.descripcion_ia,score:r.score,email:r.email,telefono:r.telefono,search_id:r.search_id}));
      st.shadow[r.id]=fieldsHash(srv);
    });
    (j.excluded||[]).forEach(function(x){
      const l=byRef[x.client_ref];if(!l)return;
      l.no_contactar=true;l.sync_skip=true;l.estado='descartado';l.motivo_descarte='Pidió no ser contactado (lista de exclusión)';
      l.interactions.push({id:uid('i'),user_id:'system',tipo:'estado',resultado:'rechazo',nota:'En la lista de exclusión del servidor: este negocio pidió no ser contactado.',fecha:new Date().toISOString()});
      excluded++;
    });
    (j.errors||[]).forEach(function(x){const l=byRef[x.client_ref];if(l)l.sync_skip=true;});
  }
  if(excluded)toast(excluded+' negocios estaban en la lista de exclusión y se han marcado «No contactar»','warn');
  if(adopted)toast(adopted+' leads ya los gestionaba el equipo: se ha recogido su estado','warn');
  return pend.length;
}
async function pushUpdates(){
  const st=syncState();
  const changed=DB.leads.filter(function(l){return l.server_id&&st.shadow[l.server_id]!==undefined&&fieldsHash(localFields(l))!==st.shadow[l.server_id];});
  if(!changed.length)return 0;
  const byId={};changed.forEach(function(l){byId[l.server_id]=l;});
  let firstErr='';
  for(let i=0;i<changed.length;i+=300){
    const chunk=changed.slice(i,i+300);
    const j=await apiJSON('POST','/api/leads/batch',{updates:chunk.map(function(l){return Object.assign({id:l.server_id,log:false},localFields(l));})},120000);
    (j.results||[]).forEach(function(r){
      const l=byId[r.id];if(!l)return;
      if(r.ok){st.shadow[r.id]=fieldsHash(localFields(l));return;}
      if(r.status===404){delete st.shadow[r.id];removeLocalLead(l);SYNC.needRender=true;return;}
      if(!firstErr)firstErr=l.nombre+': '+r.error;
      SYNC.refetch[r.id]=1;st.shadow[r.id]=fieldsHash(localFields(l));
    });
  }
  if(firstErr)toast('El servidor rechazó un cambio y se ha restaurado: '+firstErr,'warn');
  return changed.length;
}
async function pushDeletes(){
  const st=syncState();
  const local={};DB.leads.forEach(function(l){if(l.server_id)local[l.server_id]=1;});
  const gone=Object.keys(st.shadow).filter(function(sid){return !local[sid];});
  if(!gone.length)return 0;
  if(!S.user||S.user.rol!=='admin'||!(settings().apiUser&&settings().apiUser.rol==='admin')){
    /* Solo un admin borra en el servidor; el resto solo lo quita de su vista. */
    gone.forEach(function(sid){delete st.shadow[sid];});return 0;
  }
  for(let i=0;i<gone.length;i+=300){
    const j=await apiJSON('POST','/api/leads/batch',{deletes:gone.slice(i,i+300)},120000);
    (j.results||[]).forEach(function(r){if(r.ok)delete st.shadow[r.id];});
  }
  return gone.length;
}
async function pushInteractions(){
  const items=[];const ref={};
  DB.leads.forEach(function(l){
    if(!l.server_id)return;
    l.interactions.forEach(function(i){if(i.s||i.srv)return;items.push({lead_id:l.server_id,client_ref:i.id,tipo:i.tipo,resultado:i.resultado,nota:i.nota,fecha:i.fecha,user_id:i.user_id});ref[l.server_id+'|'+i.id]=i;});
  });
  if(!items.length)return 0;
  for(let k=0;k<items.length;k+=1000){
    const chunk=items.slice(k,k+1000);
    await apiJSON('POST','/api/interactions/batch',{items:chunk},120000);
    /* Hechas o rechazadas (lead ya no visible): no se reintentan en bucle. */
    chunk.forEach(function(it){const i=ref[it.lead_id+'|'+it.client_ref];if(i)i.s=1;});
  }
  return items.length;
}
async function pushSearches(){
  const pend=DB.searches.filter(function(s){return !s.synced;});
  if(!pend.length)return 0;
  const body=pend.map(function(s){
    return {id:s.id,sector:s.sector,zona:s.zona,radio:s.radio,estado:s.estado,resultados:s.resultados,nuevos:s.nuevos,duplicados:s.duplicados,programada:s.programada,
      proveedor:s.proveedor||null,params:s.params||null,stats:s.stats||null,fecha:s.fecha,
      lead_ids:(s.leadIds||[]).map(function(id){const l=leadById(id);return l&&l.server_id;}).filter(Boolean)};
  });
  await apiJSON('POST','/api/searches',{searches:body},60000);
  pend.forEach(function(s){s.synced=1;});
  return pend.length;
}
async function pullChanges(){
  const st=syncState();
  const since=st.lastPull;
  const bySid={};DB.leads.forEach(function(l){if(l.server_id)bySid[l.server_id]=l;});
  let offset=0,serverTime=null,changed=0;
  for(;;){
    const j=await apiJSON('GET','/api/leads?limit=500&offset='+offset+'&with_interactions=1'+(since?('&updated_since='+encodeURIComponent(since)):''),undefined,120000);
    if(!serverTime)serverTime=j.server_time;
    const its=j.interactions||{};
    (j.leads||[]).forEach(function(r){
      let l=bySid[r.id];
      if(!l){l=fromServerLead(r);DB.leads.push(l);bySid[r.id]=l;st.shadow[r.id]=fieldsHash(localFields(l));mergeServerInteractions(l,its[r.id]);changed++;return;}
      const sh=st.shadow[r.id];
      const pending=sh!==undefined&&fieldsHash(localFields(l))!==sh;
      const force=!!SYNC.refetch[r.id];
      applyServerLead(l,r,!pending||force);
      if(!pending||force){st.shadow[r.id]=fieldsHash(localFields(l));delete SYNC.refetch[r.id];}
      mergeServerInteractions(l,its[r.id]);
      changed++;
    });
    if((j.leads||[]).length<500)break;
    offset+=500;
  }
  /* Cambios rechazados que no han vuelto en el incremental: se piden uno a uno. */
  for(const sid of Object.keys(SYNC.refetch)){
    try{const j=await apiJSON('GET','/api/leads/'+encodeURIComponent(sid));const l=bySid[sid];if(l){applyServerLead(l,j.lead,true);st.shadow[sid]=fieldsHash(localFields(l));changed++;}}catch(e){}
    delete SYNC.refetch[sid];
  }
  if(serverTime)st.lastPull=new Date(new Date(serverTime).getTime()-5000).toISOString();
  changed+=await pullSearches();
  return changed;
}
/* Historial de búsquedas del servidor (admin/supervisor: de todo el equipo). */
async function pullSearches(){
  const j=await apiJSON('GET','/api/searches?limit=1000');
  const srv=j.searches||[];
  const bySid={};DB.leads.forEach(function(l){if(l.server_id)bySid[l.server_id]=l.id;});
  const before=JSON.stringify(DB.searches.map(function(x){return x.id+':'+x.nuevos;}));
  const pendingLocal=DB.searches.filter(function(x){return !x.synced;});
  const local={};DB.searches.forEach(function(x){local[x.id]=x;});
  const merged=srv.map(function(r){
    const prev=local[r.id]||{};
    return Object.assign({},prev,{id:r.id,user_id:r.user_id,sector:r.sector,zona:r.zona,radio:r.radio,estado:r.estado||'completada',resultados:r.resultados||0,nuevos:r.nuevos||0,duplicados:r.duplicados||0,
      fecha:r.created_at,programada:r.programada,proveedor:r.proveedor,params:r.params,stats:r.stats,synced:1,
      leadIds:(Array.isArray(r.lead_ids)?r.lead_ids:[]).map(function(sid){return bySid[sid]||sid;})});
  });
  DB.searches=pendingLocal.concat(merged);
  return JSON.stringify(DB.searches.map(function(x){return x.id+':'+x.nuevos;}))!==before?1:0;
}
async function checkVisibleIds(){
  const st=syncState();
  const j=await apiJSON('GET','/api/leads/ids');
  const set={};(j.ids||[]).forEach(function(id){set[id]=1;});
  let removed=0;
  DB.leads.slice().forEach(function(l){
    if(l.server_id&&!set[l.server_id]&&!isPending(l)){delete st.shadow[l.server_id];removeLocalLead(l);removed++;}
  });
  return removed;
}
function syncReady(){return backendConfigured()&&backendLogged()&&!!S.user;}
async function syncNow(){
  if(!syncReady())return;
  if(SYNC.running){SYNC.again=true;return;}
  SYNC.running=true;SYNC.status='syncing';updateSaveState(true);
  const st=syncState();const first=!st.lastPull;
  let pulled=0,pushed=0;
  try{
    if(!SYNC.server){try{SYNC.server=await apiJSON('GET','/api/config');SYNC.needRender=true;}catch(e){}}
    pushed+=await pushNew();
    pushed+=await pushUpdates();
    pushed+=await pushDeletes();
    pushed+=await pushInteractions();
    pushed+=await pushSearches();
    pulled+=await pullChanges();
    SYNC.count++;
    if(first||SYNC.count%6===0)pulled+=await checkVisibleIds();
    SYNC.status='ok';SYNC.error='';SYNC.lastOk=new Date().toISOString();
    if(first&&pushed)toast('Datos subidos al servidor: ya los ve el resto del equipo','ok');
  }catch(e){
    SYNC.status='error';SYNC.error=(e&&e.message)||'sin conexión';
  }finally{
    SYNC.running=false;
    saveSyncState();
    SYNC.inSync=true;persistDB();SYNC.inSync=false;
    updateSaveState(true);
    if(pulled||SYNC.needRender){
      SYNC.needRender=false;
      const a=document.activeElement;const app=document.getElementById('app');
      const typing=(a&&app&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||
        /* En el buscador no se redibuja: se perdería el panel con los resultados de la búsqueda. */
        String(S.route||'').indexOf('#/leads/search')===0;
      if(typing)SYNC.needRender=true;else{SYNC.inSync=true;render();SYNC.inSync=false;}
    }
    if(SYNC.again){SYNC.again=false;setTimeout(syncNow,400);}
  }
}
function scheduleSync(){
  if(!syncReady())return;
  clearTimeout(SYNC.debounce);
  SYNC.debounce=setTimeout(syncNow,1200);
}
function startSyncLoop(){
  if(SYNC.timer)return;
  SYNC.timer=setInterval(function(){if(document.visibilityState==='visible')syncNow();},30000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')syncNow();});
  window.addEventListener('online',function(){syncNow();});
  setTimeout(syncNow,800);
}
function stopSyncLoop(){if(SYNC.timer){clearInterval(SYNC.timer);SYNC.timer=null;}}
function syncStatusText(){
  if(!backendConfigured())return '';
  if(!backendLogged())return ' · Servidor: sin sesión';
  const pend=DB.leads.filter(function(l){return !l.sync_skip&&isPending(l);}).length;
  if(SYNC.status==='syncing')return ' · Sincronizando…';
  if(SYNC.status==='error')return ' · Servidor: sin conexión'+(pend?(' ('+pend+' pendientes)'):'');
  if(SYNC.lastOk)return ' · Servidor '+fmtDateTime(SYNC.lastOk).split(' · ').pop()+(pend?(' · '+pend+' pendientes'):'');
  return pend?(' · '+pend+' pendientes de subir'):'';
}

/* =========================================================================
   FOTOS: foto real del negocio o portada del sector (nunca stock al azar)
   ========================================================================= */
const SECTOR_COVERS={'Belleza':['#6D28D9','#DB2777','✂️'],'Automoción':['#0F172A','#2563EB','🔧'],'Restauración':['#9A3412','#DC2626','🍽️'],'Dental':['#0E7490','#2563EB','🦷'],'Salud':['#047857','#0891B2','🩺'],'Fitness':['#111827','#EA580C','🏋️'],'Inmobiliaria':['#1E3A8A','#0EA5E9','🏠'],'Bienestar':['#065F46','#65A30D','🧘'],'Servicios':['#334155','#0284C7','🛠️'],'Tapicería':['#7C2D12','#B45309','🛋️'],'Local':['#1E293B','#475569','🏪']};
function sectorCover(sector){
  const meta=sectorMeta(sector);const c=SECTOR_COVERS[meta.plantilla]||SECTOR_COVERS.Local;
  const label=String(sector||'Negocio local').slice(0,30).replace(/[<>&'"]/g,'');
  const svg="<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='700' viewBox='0 0 1200 700'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='"+c[0]+"'/><stop offset='1' stop-color='"+c[1]+"'/></linearGradient></defs><rect width='1200' height='700' fill='url(#g)'/><circle cx='1000' cy='110' r='270' fill='#fff' opacity='.07'/><circle cx='140' cy='650' r='230' fill='#fff' opacity='.06'/><text x='600' y='330' font-size='150' text-anchor='middle'>"+c[2]+"</text><text x='600' y='470' font-family='Inter,Arial,sans-serif' font-size='56' font-weight='700' fill='#fff' text-anchor='middle'>"+label+"</text></svg>";
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function mediaUrl(u){
  if(!u)return '';u=String(u);
  if(/^https?:\/\//.test(u)||u.indexOf('data:')===0)return u;
  if(u.indexOf('/media/')===0)return (apiBase()||'')+u;
  return '';
}
function leadImage(l){return mediaUrl(l&&l.image_url)||sectorCover(l&&l.sector);}

/* =========================================================================
   DEMOS PARA EL CLIENTE (web con IA + CRM de muestra), publicadas en el servidor
   ========================================================================= */
function waNumber(tel){let d=String(tel||'').replace(/\D/g,'');if(d.indexOf('0034')===0)d=d.slice(4);if(d.length===9)d='34'+d;return d;}
function demoMessage(l,url){return 'Hola, soy '+((S.user&&S.user.nombre)||'')+' de '+DEMO_BRAND+'. Hemos preparado una propuesta de web para '+l.nombre+' con vuestra información de Google. Podéis verla aquí: '+url;}
const DEMO_BRAND='Emergo';
function openDemoStudio(id){
  const l=leadById(id);if(!l)return;
  if(!backendConfigured()||!backendLogged()){
    modal({title:'Demo · '+l.nombre,body:'<p class="small">Las demos se generan con IA y se publican en vuestro servidor para poder enviar el enlace al cliente.</p><div class="notice">'+icon('plug','sm')+'<span class="small">Configura la URL del backend e inicia sesión en <b>Administración → Configuración</b>.</span></div>'});
    return;
  }
  if(!l.server_id){
    toast('Subiendo el lead al servidor…','ok');
    syncNow().then(function(){const x=leadById(id);if(x&&x.server_id)openDemoStudio(id);else toast('No se pudo subir el lead al servidor. Revisa la conexión.','err');});
    return;
  }
  if(l.no_contactar){toast('Este lead está marcado «No contactar»','warn');return;}
  modal({wide:true,title:'Demo para el cliente · '+l.nombre,body:
    '<div class="row gap8 wrap" id="dsSources"><span class="badge">Analizando datos del negocio…</span></div>'+
    '<p class="small muted mt8">La web se genera con la ficha de Google, sus reseñas y fotos reales y lo que haya en sus redes. Se publica en vuestro dominio para enviar el enlace por WhatsApp. Tarda entre 30 y 90 segundos.</p>'+
    field('Indicaciones para la IA (opcional)','<textarea class="textarea" id="dsNotes" rows="2" placeholder="Ej.: destaca que abren los sábados, tono familiar, colores sobrios…"></textarea>')+
    '<div class="row gap8 wrap"><button class="btn primary" id="dsWeb">'+icon('globe','sm')+' Generar web con IA</button><button class="btn outline" id="dsCrm">'+icon('kanban','sm')+' Generar demo de CRM</button><button class="btn ghost" id="dsLovable">'+icon('external','sm')+' Abrir en Lovable</button><button class="btn ghost" id="dsPromptBtn">'+icon('copy','sm')+' Ver prompt</button></div>'+
    '<div class="tiny muted mt8" id="dsState"></div>'+
    '<textarea class="textarea mono mt8" id="dsPrompt" readonly style="display:none;min-height:30vh;font-size:12px"></textarea>'+
    '<div id="dsPreview" class="mt16"></div>'+
    '<h4 style="margin:18px 0 8px">Demos publicadas</h4><div id="dsList"><span class="tiny muted">Cargando…</span></div>',
    onMount(root){
      let preview=null;
      const state=$('#dsState',root);
      function notes(){const n=$('#dsNotes',root);return n?n.value.trim():'';}
      function loadPreview(){
        return apiJSON('POST','/api/demos/prompt',{lead_id:l.server_id,notas:notes(),analizar:false}).then(function(j){
          preview=j;const f=j.fuentes||{};
          const s=$('#dsSources',root);
          if(s)s.innerHTML=[['Reseñas con texto',f['reseñas']],['Fotos reales',f.fotos],['Redes',f.redes]].map(function(x){return '<span class="badge" style="background:'+(x[1]?'var(--ok-tint)':'var(--surface-3)')+';color:'+(x[1]?'var(--ok)':'var(--muted)')+'">'+esc(x[0])+': '+(x[1]||0)+'</span>';}).join('')+
            ((f['reseñas']||f.fotos)?'':'<span class="tiny muted">Lead sin reseñas ni fotos (importado antes de la v1.3 o desde Apify sin detalles): vuelve a buscarlo con Google Places para una demo más rica.</span>');
          return j;
        });
      }
      function demoRow(d){
        const msg=demoMessage(l,d.url);
        return '<div class="row gap8 wrap" style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">'+
          '<span class="fill"><b class="small">'+(d.tipo==='web'?'Web':'CRM')+'</b> <span class="tiny muted">'+esc(fmtDateTime(d.created_at))+' · '+(d.visitas||0)+' visitas'+(d.ultima_visita?(' · última '+esc(fmtDateTime(d.ultima_visita))):'')+'</span><br><span class="tiny mono">'+esc(d.url)+'</span></span>'+
          '<a class="btn outline sm" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+icon('external','sm')+' Abrir</a>'+
          '<button class="btn ghost sm" data-dscopy="'+esc(d.url)+'">'+icon('copy','sm')+' Copiar enlace</button>'+
          (l.telefono?'<a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+waNumber(l.telefono)+'?text='+encodeURIComponent(msg)+'">WhatsApp</a>':'')+'</div>';
      }
      function loadList(){
        return apiJSON('GET','/api/demos?lead_id='+encodeURIComponent(l.server_id)).then(function(j){
          const box=$('#dsList',root);if(!box)return;
          const ds=j.demos||[];
          box.innerHTML=ds.length?ds.map(demoRow).join(''):'<span class="tiny muted">Todavía no hay demos para este negocio.</span>';
          $$('[data-dscopy]',box).forEach(function(b){b.onclick=function(){fallbackCopy(b.getAttribute('data-dscopy'),function(){toast('Enlace copiado','ok');});};});
          /* La ficha guarda las demos para el tab «Demos» y el envío. */
          l.demos=ds.map(function(d){return {id:d.id,tipo:d.tipo,url:d.url,estado:'generada',visitas:d.visitas||0,caduca_en:d.created_at,generada_en:d.created_at,enviada_en:null};});
          persistDB();
        }).catch(function(e){const box=$('#dsList',root);if(box)box.innerHTML='<span class="tiny" style="color:var(--danger)">'+esc(e.message)+'</span>';});
      }
      function generate(tipo,btn){
        const old=btn.innerHTML;btn.disabled=true;btn.innerHTML=icon('refresh','sm')+' Generando…';
        const t0=Date.now();
        const tick=setInterval(function(){if(state)state.textContent=(tipo==='web'?'La IA está diseñando la web con los datos reales… ':'Preparando la demo de CRM… ')+Math.round((Date.now()-t0)/1000)+' s';},1000);
        apiJSON('POST','/api/demos',{lead_id:l.server_id,tipo:tipo,notas:notes()},300000).then(function(j){
          const d=j.demo;
          if(state)state.textContent='Demo publicada en '+Math.round((Date.now()-t0)/1000)+' s.';
          const pv=$('#dsPreview',root);
          if(pv)pv.innerHTML='<iframe title="Vista previa" src="'+esc(d.url)+'" style="width:100%;height:58vh;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>';
          if(j.lovable_url&&preview)preview.lovable_url=j.lovable_url;
          l.interactions.push({id:uid('i'),user_id:S.user.id,tipo:'nota',resultado:null,nota:'Demo '+(tipo==='web'?'web':'de CRM')+' generada: '+d.url,fecha:new Date().toISOString(),s:1});
          toast('Demo lista: ya puedes enviar el enlace','ok');
          return loadList();
        }).catch(function(e){if(state)state.textContent='';toast('No se pudo generar la demo: '+e.message,'err');})
          .finally(function(){clearInterval(tick);btn.disabled=false;btn.innerHTML=old;});
      }
      $('#dsWeb',root).onclick=function(){generate('web',this);};
      $('#dsCrm',root).onclick=function(){generate('crm',this);};
      $('#dsPromptBtn',root).onclick=function(){
        const ta=$('#dsPrompt',root);
        loadPreview().then(function(j){ta.value=j.prompt||'';ta.style.display='';}).catch(function(e){toast(e.message,'err');});
      };
      $('#dsLovable',root).onclick=function(){
        /* Se abre la pestaña ya (los navegadores bloquean ventanas abiertas tras una espera). */
        const w=window.open('about:blank','_blank');
        loadPreview().then(function(j){if(w)w.location=j.lovable_url;else window.open(j.lovable_url,'_blank');toast('Lovable abierto con el prompt y las fotos: pulsa enviar allí','ok');})
          .catch(function(e){if(w)w.close();toast(e.message,'err');});
      };
      loadPreview().catch(function(e){const s=$('#dsSources',root);if(s)s.innerHTML='<span class="tiny" style="color:var(--danger)">'+esc(e.message)+'</span>';});
      loadList();
    }});
}
function openDemoModal(id){openDemoStudio(id);}
function openLeadWebModal(id){openDemoStudio(id);}

/* =========================================================================
   INIT
   ========================================================================= */
bindDelegates();
document.title='UTOP-IA CRM · v'+APP_VERSION;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(S.aiOpen){S.aiOpen=false;mountAI();}}});
window.addEventListener('resize',()=>{const t=$('#navToggle');if(t)t.style.display=window.innerWidth<=960?'inline-flex':'none';});
restoreSettings();
restoreDB();
S.route=location.hash||'#/login';
render();
restoreSession();
const nt=$('#navToggle');if(nt)nt.style.display=window.innerWidth<=960?'inline-flex':'none';
</script>
</body>
</html>
