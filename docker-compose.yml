services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: postgres://crm:crm@db:5432/crm
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_DEFAULT_ACTOR: ${APIFY_DEFAULT_ACTOR:-compass/crawler-google-places}
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  crm-db:
